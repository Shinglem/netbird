// ============================================================================
//  netbird-ui · Gradle 属性
//  ---------------------------------------------------------------------------
//  代理：GitHub 需代理、Maven 国内镜像可直连（本机代理取值见 .local/environment.md）。默认**不开**代理；
//  需要时命令行临时开：./gradlew build -Dhttps.proxyHost=<proxy-host> -Dhttps.proxyPort=<proxy-port>
// ============================================================================

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g

org.gradle.warning.mode=all

# --- 代理（按需启用）---
# systemProp.http.proxyHost=<proxy-host>
# systemProp.http.proxyPort=<proxy-port>
# systemProp.https.proxyHost=<proxy-host>
# systemProp.https.proxyPort=<proxy-port>
# systemProp.http.nonProxyHosts=localhost|127.0.0.1|maven.aliyun.com|mirrors.cloud.tencent.com|repo.huaweicloud.com
