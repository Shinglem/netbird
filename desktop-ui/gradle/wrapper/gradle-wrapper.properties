distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 国内镜像优先（官方 services.gradle.org 国内不可达）。
# 镜像不可用时改回官方：https://services.gradle.org/distributions/gradle-9.8.0-bin.zip
# 备选镜像（实测 200）：https://mirrors.huaweicloud.com/gradle/gradle-9.8.0-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.8.0-bin.zip
# 网络慢时放宽超时并重试
networkTimeout=60000
retries=3
retryBackOffMs=2000
# 镜像 URL 无法在线校验（官方校验端点不可达），故关闭
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
